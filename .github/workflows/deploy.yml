name: Build and deploy Moneyball Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull-request checks must not cancel a production Pages deployment.
# Each PR gets its own group; main pushes share the production Pages group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run import and domain tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Test beta in Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          npm run dev -- --host 127.0.0.1 > /tmp/moneyball-vite.log 2>&1 &
          node tests/browser/beta-smoke.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
